<div class="container">
  <h3>Customer List</h3>
    <button type="button" style="float: right;" class="btn btn-warning me-2"
      (click)="buttonFunctionChanges ? findAllActive() : findAll()">
      {{ buttonFunctionChanges ? 'Show Active Customers' : 'Show Deleted Customers' }}
    </button>
    <form>
      <input type="text" class="form-control me-2" placeholder="Search for customer..."
        style="width: 250px; height: 40px; float: right;" [(ngModel)]="searchTerm" name="searchCustomer"
        id="searchCustomer" (input)="filterCustomers()" />
    </form>
  <br><br>

  <table *ngIf="filteredCustomerList.length; else noCustomers" class="product-table">
    <thead class="text-center">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Document Number</th>
        <th>Customer Type</th>
        <th>Credit Score</th>
        <th></th>
        <th></th>
        <th *ngIf="buttonFunctionChanges">Deleted</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let customer of filteredCustomerList" class="border-top border-bottom ">
        <td>{{ customer.id }}</td>
        <td>{{ customer.name }}</td>
        <td>{{ customer.email }}</td>
        <td>{{ customer.phone }}</td>
        <td>{{ customer.documentNumber }}</td>
        <td>{{ customer.customerType }}</td>
        <td>{{ customer.creditScore }}</td>
        <td class="text-center">
          <a class="btn text-body-secondary " data-bs-toggle="modal" (click)="edit(customer)"
            data-bs-target="#editCustomer">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
              class="bi bi-pencil-square" viewBox="0 0 16 16">
              <path
                d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z">
              </path>
              <path fill-rule="evenodd"
                d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z">
              </path>
            </svg>
          </a>

        </td>
        <td class="text-center">
          <a (click)="delete(customer.id)" class="btn text-danger">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-trash3-fill"
              viewBox="0 0 16 16">
              <path
                d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5">
              </path>
            </svg>
          </a>
        </td>
        <td style="text-align: center" *ngIf="buttonFunctionChanges">
          <input type="checkbox" [checked]="customer.isDeleted" disabled class="custom-checkbox" />
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Caso não existam produtos -->
  <ng-template #noCustomers>
    <p>No customers available.</p>
  </ng-template>
</div>


<div class="modal fade" id="editCustomer" tabindex="-1" aria-labelledby="editCustomer" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title">Customer Details</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                  data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
              <form #customerForm="ngForm">
                  <div class="mb-3">
                      <label for="name" class="form-label">Name</label>
                      <input type="text" class="form-control" id="name" [(ngModel)]="selectedCustomer.name" name="name"
                          >
                  </div>
                  <div class="mb-3">
                      <label for="email" class="form-label">Email</label>
                      <input type="email" class="form-control" id="email" [(ngModel)]="selectedCustomer.email" name="email"
                          >
                  </div>
                  <div class="mb-3">
                      <label for="phone" class="form-label">Phone</label>
                      <input type="text" class="form-control" id="phone" [(ngModel)]="selectedCustomer.phone" name="phone"
                          >
                  </div>
                  <div class="mb-3">
                      <label for="documentNumber" class="form-label">Document Number</label>
                      <input type="text" class="form-control" id="documentNumber"
                          [(ngModel)]="selectedCustomer.documentNumber" name="documentNumber" >
                  </div>
                  <div class="mb-3">
                      <label for="creditScore" class="form-label">Credit Score</label>
                      <input type="text" class="form-control" id="creditScore" [(ngModel)]="selectedCustomer.creditScore"
                          name="creditScore" >
                  </div>
                  <div class="mb-3">
                      <label for="customerType" class="form-label">Customer Type</label>
                      <select class="form-select" id="customerType" [(ngModel)]="selectedCustomer.customerType"
                          name="customerType" >
                          <option value="LEGAL_PERSON">Legal Person</option>
                          <option value="NATURAL_PERSON">Natural Person</option>
                      </select>
                  </div>
              </form>
          </div>
          <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="button" class="btn btn-warning" data-bs-dismiss="modal"
                  (click)="updateCustomer()">Edit</button>
          </div>
      </div>
  </div>
</div>
