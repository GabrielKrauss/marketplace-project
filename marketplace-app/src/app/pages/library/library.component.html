
<div style="overflow: hidden;">
<div *ngIf="!customerLogged" class="alert alert-warning text-center" role="alert">
  Please log in to access your library.
</div>

<!-- Verificação da biblioteca do usuário -->
<div *ngIf="customerLogged && products.length === 0" class="alert alert-info text-center" role="alert">
  Your library is empty. Check out the available products!
</div>
<!-- Pesquisa de produto -->

<div  *ngIf="customerLogged && products.length > 0" class="container" >
  <h2 class="fw-normal text-center align-items-center" id="product-album">
    Checkout your games!!
  </h2>
  <br><br>
<div  class="container" style="float: right; width: 80%;">
  <div data-bs-theme="dark">
    <form class="p-2 bg-dark border-bottom border-dark">
      <input type="text" class="form-control" placeholder="Search for product..." 
             [(ngModel)]="searchTerm" (ngModelChange)="onFilterChange()" 
             name="searchTerm" id="searchTerm" />
    </form>
  </div>

  <!-- Lista de Produtos da Library -->
  <div class="album py-3 bg-body-tertiary">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
      <!-- Exibe produtos filtrados -->
      <div *ngFor="let product of filteredProductsList" class="col" 
           [ngClass]="{ 'd-none': product.isDeleted }">
        <div class="card shadow-sm h-100">
          <img [src]="product.imagesUrl" class="card-img-top" alt="{{ product.name }}"
               [routerLink]="['/product', product.id]" />
          <div class="card-body d-flex flex-column">
            <h5 class="card-title" [routerLink]="['/product', product.id]">
              {{ product.name }}
            </h5>
            <div class="mb-2">
              <span *ngFor="let category of product.categories"
                    class="badge bg-light-subtle text-light-emphasis rounded-pill me-1">
                {{ category.name }}
              </span>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <div class="btn-group">
                <a type="button" class="btn btn-sm btn-secondary" 
                   [routerLink]="['/product', product.id]" routerLinkActive="router-link-active">
                  View
                </a>
                <a *ngIf="product.fileUrl" class="btn btn-sm btn-warning"
                   (click)="download(product.fileUrl, product.name)" download>
                  Download
                </a>
              </div>
              <small class="text-body-secondary">ID: {{ product.id }}</small>
            </div>
          </div>
        </div>
      </div>
      <!-- Caso não encontre produtos -->
      <div *ngIf="filteredProductsList.length === 0" class="text-center w-100">
        <p>No products found.</p>
      </div>
    </div>
    <br>
  </div>
</div>

<div class="container" style="float: left; width: 20%;">
  <div class="list-group">
    <form>
      <input type="text" class="form-control" placeholder="Search for category..." 
             [(ngModel)]="searchCategory" name="searchCategory" id="searchCategory" 
             (input)="filterCategories()" />
    </form>
    <label class="list-group-item d-flex gap-2" *ngFor="let category of filteredCategoryList">
      <input class="custom-checkbox" type="checkbox" value="" [checked]="isSelected(category)"
             (change)="toggleCategory(category)">
      <span>{{ category.name }}</span>
      
    </label>
    <div *ngIf="filteredCategoryList.length === 0" class="text-center w-100">
      <span>No category found.</span>
    </div>
  </div>
</div>
</div>
