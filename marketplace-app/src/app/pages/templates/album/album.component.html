<h2 class="fw-normal text-center align-items-center" id="product-album">Checkout our games!!</h2>
<br>
<br>
<div class="container" style="float: right; width: 80%;">
  <div data-bs-theme="dark">
    <form class="p-2 bg-dark border-bottom border-dark">
      <input type="text" class="form-control" placeholder="Search for product..." [(ngModel)]="searchTerm"
        (ngModelChange)="onFilterChange()" name="searchTerm" id="searchTerm" />
    </form>

  </div>
  <div class="album py-3 bg-body-tertiary">


    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
      <!-- Exibe produtos filtrados -->
      <div *ngFor="let product of products" class="col" [ngClass]="{ 'd-none': product.isDeleted }">
        <div class="card shadow-sm h-100">
          <div class="card-img-wrap" [routerLink]="['/product', product.id]" style="cursor: pointer;">
            <img [src]="product.imagesUrl" class="card-img-top" alt="{{ product.name }}" />
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title" [routerLink]="['/product', product.id]">{{ product.name }}</h5>
            <small class="text-body-secondary" *ngIf="!product.isPhysical">Digital Copy</small>
            <small class="text-body-secondary" *ngIf="product.isPhysical">Physical Copy</small>
            <div class="mb-2">
              <span *ngFor="let category of product.categories"
                class="badge bg-light-subtle text-light-emphasis rounded-pill me-1">
                {{ category.name }}
              </span>
            </div>
            <p class="card-text flex-grow-1">{{ product.description }}</p>
            <p class="card-text"><strong>Price:</strong> ${{ product.unitPrice }}</p>

            <div class="d-flex justify-content-between align-items-center mt-3">
              <div class="btn-group">
                <a type="button" class="btn btn-sm btn-secondary" [routerLink]="['/product', product.id]"
                  routerLinkActive="router-link-active">
                  View
                </a>
                <button type="button" class="btn btn-sm btn-warning" *ngIf="product.sellIndicator"
                  (click)="addToCart(product)">
                  + Add to Cart
                </button>
                <button type="button" class="btn btn-sm btn-danger disabled" aria-disabled="true"
                  *ngIf="!product.sellIndicator">
                  Unavailable
                </button>
              </div>
              <small class="text-body-secondary">ID: {{ product.id }}</small>
            </div>
          </div>
        </div>

      </div>

      <!-- Caso não encontre produtos -->
      <div *ngIf="products.length === 0" class="text-center w-100">
        <p>No products found.</p>
      </div>
    </div>
    <br>
    <nav aria-label="Page navigation">
      <ul class="pagination justify-content-end">
        <li class="page-item " [class.disabled]="page === 0">
          <button class="page-link text-warning" (click)="goToPage(page - 1)">Previous</button>
        </li>

        <!-- Gerar as páginas dinamicamente -->
        <li *ngFor="let pageNumber of [].constructor(totalPages); let i = index" class="page-item"
          [class.active]="page === i">
          <button class="page-link text-warning" (click)="goToPage(i)">{{ i + 1 }}</button>
        </li>

        <li class="page-item" [class.disabled]="page === totalPages - 1">
          <button class="page-link text-warning" (click)="goToPage(page + 1)">Next</button>
        </li>
      </ul>
    </nav>
  </div>


</div>


<div>
  <div class="list-group">
    <form>
      <input type="text" class="form-control" placeholder="Search for category..." [(ngModel)]="searchCategory"
        name="searchCategory" id="searchCategory" (input)="filterCategories()" />
    </form>

    <label class="list-group-item d-flex gap-2" *ngFor="let category of filteredCategoryList">
      <input class="custom-checkbox" type="checkbox" value="" [checked]="isSelected(category)"
        (input)="toggleCategory(category)">
      <span>
        {{ category.name }}
      </span>
    </label>
    <div *ngIf="filteredCategoryList.length === 0" class="text-center w-100">
      <span>No category found.</span>
    </div>
  </div>
</div>
